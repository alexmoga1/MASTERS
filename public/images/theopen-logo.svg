<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Open 2026 golf pool">
  <defs>
    <linearGradient id="jug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c477"/>
      <stop offset="0.5" stop-color="#c8a24b"/>
      <stop offset="1" stop-color="#a07f30"/>
    </linearGradient>
  </defs>

  <!-- base disc + gold ring -->
  <circle cx="32" cy="32" r="30" fill="#0a1f44"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#c8a24b" stroke-width="3"/>

  <!-- subtle inner glow -->
  <circle cx="32" cy="30" r="24" fill="#ffffff" opacity="0.04"/>

  <g fill="url(#jug)" stroke="#8f6f28" stroke-width="0.5" stroke-linejoin="round">
    <!-- finial -->
    <circle cx="32" cy="12.5" r="1.8"/>
    <rect x="31.2" y="13.5" width="1.6" height="2.4"/>
    <!-- domed lid -->
    <path d="M25.5 20 Q32 13.5 38.5 20 Z"/>
    <rect x="25" y="19.4" width="14" height="1.8" rx="0.9"/>
    <!-- neck -->
    <path d="M28 21.2 L36 21.2 L35 26 L29 26 Z"/>
    <!-- body / urn -->
    <path d="M29 26 Q22 30 22.5 38 Q23 46 32 47.5 Q41 46 41.5 38 Q42 30 35 26 Z"/>
    <!-- stem -->
    <rect x="29.6" y="47" width="4.8" height="4.4"/>
  </g>

  <!-- handles (open loops) -->
  <g fill="none" stroke="url(#jug)" stroke-width="2.4" stroke-linecap="round">
    <path d="M28.5 23 Q19.5 26 22.5 37"/>
    <path d="M35.5 23 Q44.5 26 41.5 37"/>
  </g>

  <!-- foot -->
  <ellipse cx="32" cy="52" rx="8.5" ry="2.4" fill="url(#jug)" stroke="#8f6f28" stroke-width="0.5"/>

  <!-- engraved highlight -->
  <path d="M27 32 Q30 30 33 31" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
</svg>
