<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="U.S. Open 2026 golf pool">
  <defs>
    <clipPath id="ring"><circle cx="32" cy="32" r="29"/></clipPath>
    <path id="usopen-star" d="M0,-5 1.18,-1.62 4.76,-1.55 1.9,0.62 2.94,4.05 0,2 -2.94,4.05 -1.9,0.62 -4.76,-1.55 -1.18,-1.62 Z"/>
  </defs>

  <!-- base disc + red ring -->
  <circle cx="32" cy="32" r="30" fill="#0a3161"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#b31942" stroke-width="3"/>

  <g clip-path="url(#ring)">
    <!-- putting-surface highlight -->
    <ellipse cx="30" cy="45" rx="17" ry="4" fill="#ffffff" opacity="0.12"/>

    <!-- flagstick -->
    <line x1="27" y1="14" x2="27" y2="45" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- red pennant -->
    <path d="M27 14 L48 19.5 L27 25 Z" fill="#b31942"/>
    <!-- white star on the pennant -->
    <use href="#usopen-star" transform="translate(34,19.4) scale(0.62)" fill="#ffffff"/>

    <!-- golf ball at the base of the pin -->
    <circle cx="27" cy="45" r="3.3" fill="#ffffff"/>

    <!-- patriotic star arc along the bottom -->
    <g fill="#ffffff">
      <use href="#usopen-star" transform="translate(20,52) scale(0.42)"/>
      <use href="#usopen-star" transform="translate(32,54) scale(0.42)"/>
      <use href="#usopen-star" transform="translate(44,52) scale(0.42)"/>
    </g>
  </g>
</svg>
